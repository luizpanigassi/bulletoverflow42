SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecResponseBodyAccess Off

SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLog /dev/stdout
SecDebugLog /dev/stderr
SecDebugLogLevel 0

SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

SecRule REQUEST_HEADERS:Content-Type "application/json" \
    "id:1000001,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

SecAction \
    "id:1000002,phase:1,pass,nolog,\
    t:none,\
    setvar:tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE,\
    setvar:tx.paranoia_level=1,\
    setvar:tx.inbound_anomaly_score_threshold=10,\
    setvar:tx.outbound_anomaly_score_threshold=5"

SecRule REQUEST_URI "@beginsWith /matchmaking/queue" \
    "id:1000003,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"

SecRule REQUEST_URI "@beginsWith /matches/" \
    "id:1000004,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"

